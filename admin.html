<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Voltix — Admin</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<!-- ============ LOGIN GATE ============ -->
<section class="gate" id="gate" hidden>
    <form class="gate__box" id="gateForm" novalidate>
        <a href="index.html" class="logo"><span class="logo__mark">V</span><span class="logo__text">VOLTIX</span></a>
        <h1 class="gate__title">Admin panel</h1>
        <p class="notice">
            <span>Демо-доступ</span>
            Login: <b>admin@voltix.com</b><br>
            Пароль: <b>admin123</b>
        </p>
        <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username"></label>
        <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password"></label>
        <p class="form__msg form__msg--error" id="gateMsg" role="alert"></p>
        <button class="btn btn--dark btn--block" type="submit">Sign in</button>
    </form>
</section>

<!-- ============ PANEL ============ -->
<div class="panel" id="panel" hidden>

    <aside class="side">
        <a href="index.html" class="logo logo--light"><span class="logo__mark">V</span><span class="logo__text">VOLTIX</span></a>
        <nav class="side__nav" id="sideNav">
            <button class="side__link is-active" type="button" data-tab="dash">Dashboard</button>
            <button class="side__link" type="button" data-tab="products">Products</button>
            <button class="side__link" type="button" data-tab="categories">Categories</button>
            <button class="side__link" type="button" data-tab="banners">Banners</button>
            <button class="side__link" type="button" data-tab="orders">Orders</button>
            <button class="side__link" type="button" data-tab="subs">Subscribers</button>
        </nav>
        <div class="side__foot">
            <a class="side__link" href="index.html" target="_blank" rel="noopener">↗ Open store</a>
            <button class="side__link" id="resetBtn" type="button">↺ Reset demo data</button>
            <button class="side__link side__link--danger" id="logoutBtn" type="button">→ Log out</button>
        </div>
    </aside>

    <main class="work">

        <!-- ---------- DASHBOARD ---------- -->
        <section class="tab is-active" data-panel="dash">
            <header class="work__head"><h1>Dashboard</h1></header>
            <div class="stats" id="stats"></div>
            <div class="card-box">
                <h2 class="box__title">Latest orders</h2>
                <div id="dashOrders"></div>
            </div>
        </section>

        <!-- ---------- PRODUCTS ---------- -->
        <section class="tab" data-panel="products">
            <header class="work__head">
                <h1>Products</h1>
                <div class="work__tools">
                    <input class="inp" id="pSearch" type="search" placeholder="Search…">
                    <select class="inp" id="pCat"><option value="">All categories</option></select>
                    <button class="btn btn--ghost" id="pGenDel" type="button">Удалить сгенерированные</button>
                    <button class="btn btn--ghost" id="pGen" type="button">⚡ Генератор</button>
                    <button class="btn btn--dark" id="pNew" type="button">+ New product</button>
                </div>
            </header>
            <div class="card-box"><div id="pTable"></div></div>
        </section>

        <!-- ---------- CATEGORIES ---------- -->
        <section class="tab" data-panel="categories">
            <header class="work__head">
                <h1>Categories</h1>
                <button class="btn btn--dark" id="cNew" type="button">+ New category</button>
            </header>
            <div class="card-box"><div id="cTable"></div></div>
        </section>

        <!-- ---------- BANNERS ---------- -->
        <section class="tab" data-panel="banners">
            <header class="work__head">
                <h1>Hero banners</h1>
                <button class="btn btn--dark" id="bNew" type="button">+ New banner</button>
            </header>
            <div class="card-box"><div id="bTable"></div></div>
        </section>

        <!-- ---------- ORDERS ---------- -->
        <section class="tab" data-panel="orders">
            <header class="work__head"><h1>Orders</h1></header>
            <div class="card-box"><div id="oTable"></div></div>
        </section>

        <!-- ---------- SUBSCRIBERS ---------- -->
        <section class="tab" data-panel="subs">
            <header class="work__head"><h1>Subscribers</h1></header>
            <div class="card-box"><div id="sTable"></div></div>
        </section>

    </main>
</div>

<!-- ============ FORM MODAL ============ -->
<div class="modal" id="formModal" hidden>
    <div class="modal__box modal__box--wide">
        <button class="icon-btn modal__close" data-close type="button" aria-label="Close">✕</button>
        <h2 class="modal__title" id="formTitle">Edit</h2>
        <form id="crudForm" novalidate>
            <div class="grid2" id="formFields"></div>
            <p class="form__msg form__msg--error" id="formMsg" role="alert"></p>
            <div class="form__actions">
                <button class="btn btn--ghost" data-close type="button">Cancel</button>
                <button class="btn btn--dark" type="submit" id="formSubmit">Save</button>
            </div>
        </form>
    </div>
</div>

<div class="modal" id="confirmModal" hidden>
    <div class="modal__box modal__box--sm">
        <h2 class="modal__title" id="confirmTitle">Удалить?</h2>
        <p class="done__text" id="confirmText"></p>
        <div class="form__actions">
            <button class="btn btn--ghost" data-close type="button">Cancel</button>
            <button class="btn btn--danger" id="confirmYes" type="button">Delete</button>
        </div>
    </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
